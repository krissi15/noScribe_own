[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traudi"
# Die Version steht ausschließlich in noScribe/_version.py.
dynamic = ["version"]
description = "Traudi – Transkription für die Justiz (Fork von noScribe)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.txt" }

dependencies = [
    "av",
    "AdvancedHTMLParser",
    "appdirs",
    "customtkinter",
    "CTkToolTip",
    "faster-whisper",
    "huggingface_hub",
    "Pillow",
    "pyannote.audio>=4.0",
    "python-i18n",
    "PyYAML",
]

[project.optional-dependencies]
# torch/torchaudio 2.8: pyannote 4.0 läuft nicht mit torch 2.9.
# Für CUDA zusätzlich den PyTorch-Index angeben:
#   pip install -e ".[cuda]" --extra-index-url https://download.pytorch.org/whl/cu128
cuda = ["torch==2.8", "torchaudio==2.8", "cpufeature"]
build = ["pyinstaller==6.14.1"]

[tool.setuptools]
# Nur für `pip install -e .` gedacht. trans/, img/, prompts/, models/ und
# pyannote/ liegen als Namespace-Pakete neben noScribe/ und werden über
# importlib.resources gefunden -- ein nicht-editierbarer Install würde sie
# nicht mitnehmen. Für Endnutzer gibt es den Installer.
packages = ["noScribe", "noScribe.audio", "noScribe.dialogs", "noScribe.theme"]

[tool.setuptools.dynamic]
version = { attr = "noScribe._version.__version__" }

[tool.setuptools.package-data]
"noScribe.theme" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Die Tests kommen ohne GUI, ohne Modelle und ohne GPU aus.
addopts = "-q"
