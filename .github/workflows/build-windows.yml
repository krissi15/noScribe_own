name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: environments/requirements_win_cpu.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r environments/requirements_win_cpu.txt

      # The Whisper weights are not bundled - Traudi downloads them on first
      # start. The diarization weights are only 32 MB and have to ship with the
      # installer, because their repository is gated.
      - name: Fetch diarization weights
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/fetch_models.py --skip-whisper --pyannote

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build installer
        run: python pyinstaller/win_build.py

      - uses: actions/upload-artifact@v4
        with:
          name: traudi-windows-installer
          path: pyinstaller/win_installer/*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pyinstaller/win_installer/*.exe
