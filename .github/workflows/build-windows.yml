name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Welche Variante gebaut werden soll'
        type: choice
        default: cpu
        options: [cpu, cuda]
  push:
    tags:
      - 'v*'

# softprops/action-gh-release braucht Schreibrechte, um den Installer an das
# Release zu hängen. Ohne diesen Block scheitert der letzte Schritt.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      VARIANT: ${{ github.event.inputs.variant || 'cpu' }}
      # Auf Job-Ebene, damit die Schritte unten `env.HF_TOKEN` in ihrer
      # `if`-Bedingung prüfen können -- der `secrets`-Kontext steht dort
      # nicht zur Verfügung.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: environments/requirements_win_${{ github.event.inputs.variant || 'cpu' }}.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($env:VARIANT -eq 'cpu') {
            # Zuerst und getrennt aus dem CPU-Index -- siehe Kommentar in
            # environments/requirements_win_cpu.txt.
            pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8 torchaudio==2.8
          }
          pip install -r environments/requirements_win_$env:VARIANT.txt
          # Der Editor bringt seinen eigenen Baukasten mit (PyQt6). Ohne ihn
          # bricht build_editor() ab, statt den Editor stillschweigend
          # wegzulassen -- das war der alte Fehler.
          pip install -r noScribeEdit/environments/requirements.txt

      # Beide Listen oben landen in derselben Umgebung, die spaetere gewinnt.
      # So wurde v0.7.4 mit PyInstaller 6.4.0 statt 6.14.1 gebaut und startete
      # nicht ("No module named 'jaraco'"). Gebaut wird nur mit der Fassung,
      # die in der Liste der Variante festgelegt ist.
      - name: Verify the pinned PyInstaller version is installed
        run: |
          $pin = (Select-String -Path "environments/requirements_win_$env:VARIANT.txt" -Pattern '^pyinstaller==([0-9.]+)').Matches[0].Groups[1].Value
          $have = (python -m PyInstaller --version).Trim()
          Write-Host "PyInstaller installiert: $have, festgelegt: $pin"
          if ($have -ne $pin) { throw "PyInstaller $have installiert, festgelegt ist $pin." }

      # Regressionsschutz fuer genau den Fehler, der diesen Bau bisher
      # vermutlich hat scheitern lassen: eine "CPU"-Variante, die in
      # Wirklichkeit die CUDA-Raeder samt Laufzeit mitbringt (mehrere GB).
      - name: Verify the CPU build really is CPU-only
        if: env.VARIANT == 'cpu'
        run: |
          python -c "import torch, sys; print('torch', torch.__version__, 'cuda', torch.version.cuda); sys.exit(1 if torch.version.cuda else 0)"

      # Die Whisper-Gewichte werden nicht mitgeliefert - Traudi lädt sie beim
      # ersten Start. Die Diarisierungs-Gewichte sind nur 32 MB und sollten
      # mitkommen, weil ihr Repository zugangsbeschränkt ist.
      #
      # Fehlt das Secret, bricht der Bau NICHT ab: Traudi lädt die Gewichte
      # dann beim ersten Bedarf nach. Ein Installer ohne Sprechererkennung ist
      # allemal besser als gar kein Installer.
      - name: Fetch diarization weights
        id: pyannote
        if: env.HF_TOKEN != ''
        continue-on-error: true
        run: python scripts/fetch_models.py --skip-whisper --pyannote

      - name: Warn if diarization weights are missing
        if: env.HF_TOKEN == '' || steps.pyannote.outcome == 'failure'
        run: |
          Write-Warning "Die Diarisierungs-Gewichte fehlen im Installer."
          Write-Warning "Traudi laedt sie beim ersten Bedarf nach."
          Write-Warning "Zum Mitliefern das Repository-Secret HF_TOKEN hinterlegen."

      # community.chocolatey.org antwortet gelegentlich mit 503. choco meldet
      # dann trotzdem Erfolg ("installed 0/0 packages"), und der Bau scheitert
      # erst Minuten spaeter an "makensis wurde nicht gefunden". Deshalb bis zu
      # viermal versuchen und danach pruefen, ob makensis wirklich da ist.
      - name: Install NSIS
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          for ($i = 1; $i -le 4 -and -not (Test-Path $makensis); $i++) {
            if ($i -gt 1) { Write-Host "Neuer Versuch $i in $(15 * $i) s ..."; Start-Sleep -Seconds (15 * $i) }
            choco install nsis --no-progress -y
          }
          if (-not (Test-Path $makensis)) { throw "NSIS ist nicht installiert: $makensis fehlt." }
          Write-Host "NSIS gefunden: $makensis"
          $global:LASTEXITCODE = 0

      # Der PyInstaller-Lauf ist der plattenhungrigste Schritt. Schlaegt er
      # fehl, spart diese Ausgabe eine Rateschleife.
      - name: Report free disk space
        run: Get-PSDrive C | Select-Object Used, Free

      - name: Build installer
        run: |
          if ($env:VARIANT -eq 'cuda') {
            python pyinstaller/win_build.py --cuda
          } else {
            python pyinstaller/win_build.py
          }

      # Bisher pruefte nichts, ob das Gebaute ueberhaupt startet: v0.7.4 brach
      # im Laufzeit-Hook ab, bevor eine Zeile von Traudi lief, und der Bau war
      # trotzdem gruen. Laeuft ein Programm nach 45 s noch, gilt der Start als
      # gelungen -- ohne Modell wartet Traudi dann auf den Download-Dialog.
      - name: Smoke test - do the built programs start?
        run: |
          $dist = if ($env:VARIANT -eq 'cuda') { 'Traudi_cuda' } else { 'Traudi_cpu' }
          $apps = @(
            "pyinstaller\dist\$dist\Traudi\Traudi.exe",
            "pyinstaller\dist\$dist\Traudi\_internal\noScribeEdit\noScribeEdit.exe"
          )
          foreach ($exe in $apps) {
            if (-not (Test-Path $exe)) { throw "$exe fehlt." }
            $err = New-TemporaryFile
            $p = Start-Process -FilePath $exe -PassThru -RedirectStandardError $err
            $null = $p.Handle  # sonst bleibt ExitCode nach dem Ende leer
            Start-Sleep -Seconds 45
            if ($p.HasExited) {
              Get-Content $err
              throw "$exe hat sich beim Start beendet (Exit-Code $($p.ExitCode))."
            }
            Stop-Process -Id $p.Id -Force
            Write-Host "$exe laeuft nach 45 s noch -- Start in Ordnung."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: traudi-windows-installer-${{ github.event.inputs.variant || 'cpu' }}
          path: pyinstaller/win_installer/*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pyinstaller/win_installer/*.exe
