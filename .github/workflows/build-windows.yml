name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Welche Variante gebaut werden soll'
        type: choice
        default: cpu
        options: [cpu, cuda]
  push:
    tags:
      - 'v*'

# softprops/action-gh-release braucht Schreibrechte, um den Installer an das
# Release zu hängen. Ohne diesen Block scheitert der letzte Schritt.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      VARIANT: ${{ github.event.inputs.variant || 'cpu' }}
      # Auf Job-Ebene, damit die Schritte unten `env.HF_TOKEN` in ihrer
      # `if`-Bedingung prüfen können -- der `secrets`-Kontext steht dort
      # nicht zur Verfügung.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      # Der Bau installiert und startet fremden Code (pip-Pakete, PyInstaller).
      # Das Schreib-Token soll dabei nicht in .git/config liegen; die Schritte,
      # die es brauchen, bekommen es ausdrücklich.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: environments/requirements_win_${{ github.event.inputs.variant || 'cpu' }}.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($env:VARIANT -eq 'cpu') {
            # Zuerst und getrennt aus dem CPU-Index -- siehe Kommentar in
            # environments/requirements_win_cpu.txt.
            pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8 torchaudio==2.8
          }
          pip install -r environments/requirements_win_$env:VARIANT.txt
          # Der Editor bringt seinen eigenen Baukasten mit (PyQt6). Ohne ihn
          # bricht build_editor() ab, statt den Editor stillschweigend
          # wegzulassen -- das war der alte Fehler.
          pip install -r noScribeEdit/environments/requirements.txt

      # Beide Listen oben landen in derselben Umgebung, die spaetere gewinnt.
      # So wurde v0.7.4 mit PyInstaller 6.4.0 statt 6.14.1 gebaut und startete
      # nicht ("No module named 'jaraco'"). Gebaut wird nur mit der Fassung,
      # die in der Liste der Variante festgelegt ist.
      - name: Verify the pinned PyInstaller version is installed
        run: |
          $pin = (Select-String -Path "environments/requirements_win_$env:VARIANT.txt" -Pattern '^pyinstaller==([0-9.]+)').Matches[0].Groups[1].Value
          $have = (python -m PyInstaller --version).Trim()
          Write-Host "PyInstaller installiert: $have, festgelegt: $pin"
          if ($have -ne $pin) { throw "PyInstaller $have installiert, festgelegt ist $pin." }

      # Regressionsschutz fuer genau den Fehler, der diesen Bau bisher
      # vermutlich hat scheitern lassen: eine "CPU"-Variante, die in
      # Wirklichkeit die CUDA-Raeder samt Laufzeit mitbringt (mehrere GB).
      - name: Verify the CPU build really is CPU-only
        if: env.VARIANT == 'cpu'
        run: |
          python -c "import torch, sys; print('torch', torch.__version__, 'cuda', torch.version.cuda); sys.exit(1 if torch.version.cuda else 0)"

      # Die Whisper-Gewichte werden nicht mitgeliefert - Traudi lädt sie beim
      # ersten Start. Die Diarisierungs-Gewichte sind nur 32 MB und sollten
      # mitkommen, weil ihr Repository zugangsbeschränkt ist.
      #
      # Fehlt das Secret, bricht der Bau NICHT ab: Traudi lädt die Gewichte
      # dann beim ersten Bedarf nach. Ein Installer ohne Sprechererkennung ist
      # allemal besser als gar kein Installer.
      - name: Fetch diarization weights
        id: pyannote
        if: env.HF_TOKEN != ''
        continue-on-error: true
        run: python scripts/fetch_models.py --skip-whisper --pyannote

      - name: Warn if diarization weights are missing
        if: env.HF_TOKEN == '' || steps.pyannote.outcome == 'failure'
        run: |
          Write-Warning "Die Diarisierungs-Gewichte fehlen im Installer."
          Write-Warning "Traudi laedt sie beim ersten Bedarf nach."
          Write-Warning "Zum Mitliefern das Repository-Secret HF_TOKEN hinterlegen."

      # community.chocolatey.org antwortet gelegentlich mit 503 -- am 14.10.2026
      # mehrmals, auch ueber vier Versuche hinweg. choco meldet dann trotzdem
      # Erfolg ("installed 0/0 packages"). Deshalb: einige Versuche, danach
      # das portable ZIP direkt vom NSIS-Projekt (Pruefsumme festgelegt), und
      # am Ende muss makensis wirklich da sein. Der Ordner kommt in den PATH,
      # dort sucht win_build.py zuerst.
      - name: Install NSIS
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          for ($i = 1; $i -le 3 -and -not (Test-Path $makensis); $i++) {
            if ($i -gt 1) { Write-Host "Neuer Versuch $i in $(15 * $i) s ..."; Start-Sleep -Seconds (15 * $i) }
            choco install nsis --no-progress -y
          }
          if (-not (Test-Path $makensis)) {
            Write-Warning 'Chocolatey nicht erreichbar -- NSIS 3.11 direkt von SourceForge.'
            $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
            Invoke-WebRequest -UserAgent 'Wget/1.21' -OutFile $zip `
              -Uri 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip'
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
            if ($hash -ne 'C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1') {
              throw "Pruefsumme von nsis-3.11.zip stimmt nicht: $hash"
            }
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
            $makensis = Join-Path $env:RUNNER_TEMP 'nsis-3.11\makensis.exe'
          }
          if (-not (Test-Path $makensis)) { throw "NSIS ist nicht installiert: $makensis fehlt." }
          Split-Path $makensis | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "NSIS gefunden: $makensis"
          $global:LASTEXITCODE = 0

      # Der PyInstaller-Lauf ist der plattenhungrigste Schritt. Schlaegt er
      # fehl, spart diese Ausgabe eine Rateschleife.
      - name: Report free disk space
        run: Get-PSDrive C | Select-Object Used, Free

      - name: Build installer
        run: |
          if ($env:VARIANT -eq 'cuda') {
            python pyinstaller/win_build.py --cuda
          } else {
            python pyinstaller/win_build.py
          }

      # Bisher pruefte nichts, ob das Gebaute ueberhaupt startet: v0.7.4 brach
      # im Laufzeit-Hook ab, bevor eine Zeile von Traudi lief, und der Bau war
      # trotzdem gruen. Laeuft ein Programm nach 45 s noch, gilt der Start als
      # gelungen -- ohne Modell wartet Traudi dann auf den Download-Dialog.
      - name: Smoke test - do the built programs start?
        run: |
          $dist = if ($env:VARIANT -eq 'cuda') { 'Traudi_cuda' } else { 'Traudi_cpu' }
          $apps = @(
            "pyinstaller\dist\$dist\Traudi\Traudi.exe",
            "pyinstaller\dist\$dist\Traudi\_internal\noScribeEdit\noScribeEdit.exe"
          )
          foreach ($exe in $apps) {
            if (-not (Test-Path $exe)) { throw "$exe fehlt." }
            $err = New-TemporaryFile
            $p = Start-Process -FilePath $exe -PassThru -RedirectStandardError $err
            $null = $p.Handle  # sonst bleibt ExitCode nach dem Ende leer
            Start-Sleep -Seconds 45
            if ($p.HasExited) {
              Get-Content $err
              throw "$exe hat sich beim Start beendet (Exit-Code $($p.ExitCode))."
            }
            Stop-Process -Id $p.Id -Force
            Write-Host "$exe laeuft nach 45 s noch -- Start in Ordnung."
          }

      # Die Startprobe oben sieht nur, ob das Fenster aufgeht. pyannote wird
      # erst bei einer Transkription geladen -- in 0.7.5 fehlte dort ein
      # scipy-Modul, und erst der Anwender bemerkte es. --selftest laesst die
      # Sprechererkennung im gebauten Programm auf demselben Weg laufen wie
      # ein echter Job. Exit-Code 3 heisst: Gewichte fehlen. Das ist nur dann
      # ein Fehler, wenn ein HF_TOKEN sie haette mitbringen sollen.
      - name: Self test - does speaker detection load and run?
        timeout-minutes: 15
        run: |
          $dist = if ($env:VARIANT -eq 'cuda') { 'Traudi_cuda' } else { 'Traudi_cpu' }
          $exe = "pyinstaller\dist\$dist\Traudi\Traudi.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -PassThru -Wait -NoNewWindow `
                 -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          Get-Content selftest.out, selftest.err
          if ($p.ExitCode -eq 3 -and -not $env:HF_TOKEN) {
            Write-Warning 'Selbsttest uebersprungen: ohne HF_TOKEN fehlen die Gewichte im Installer.'
          } elseif ($p.ExitCode -ne 0) {
            throw "Selbsttest der Sprechererkennung fehlgeschlagen (Exit-Code $($p.ExitCode))."
          }
          $global:LASTEXITCODE = 0

      # Bisher geprueft wurde nur der dist-Ordner. Ob der Installer tut, was
      # das README der IT verspricht -- Zielordner, Registry-Eintrag fuer die
      # Erkennungsregel, Uebernahme der 32-Bit-Altinstallation bis 0.7.6,
      # Selbsttest aus dem installierten Ordner, stille Deinstallation --,
      # prueft dieser Schritt so, wie eine Softwareverteilung es taete.
      - name: Installer test - upgrade from 0.7.6, install, selftest, uninstall
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem pyinstaller\win_installer\*.exe | Select-Object -First 1).FullName
          $version = (Select-String noScribe\_version.py -Pattern '^__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          $dir = Join-Path $env:ProgramFiles 'Traudi'
          $legacyDir = Join-Path ${env:ProgramFiles(x86)} 'Traudi'
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Traudi'
          $legacyKey = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Traudi'

          # 1. Die letzte 32-Bit-Fassung vorinstallieren, wie sie im Feld liegt.
          gh release download v0.7.6 --repo $env:GITHUB_REPOSITORY --pattern '*.exe' --dir legacy
          $haveLegacy = $LASTEXITCODE -eq 0
          if ($haveLegacy) {
            $old = (Get-ChildItem legacy\*.exe | Select-Object -First 1).FullName
            Start-Process $old -ArgumentList '/S' -Wait
            if (-not (Test-Path "$legacyDir\Traudi.exe")) { throw 'Altinstallation 0.7.6 wurde nicht angelegt.' }
            Write-Host "Altinstallation 0.7.6 liegt in $legacyDir"
          } else {
            Write-Warning 'v0.7.6 nicht ladbar -- die Uebernahme der Altinstallation bleibt ungeprueft.'
          }

          # 2. Die neue Fassung still darueber installieren.
          $p = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer endete mit Exit-Code $($p.ExitCode)." }
          if (-not (Test-Path "$dir\Traudi.exe")) { throw "Traudi.exe fehlt in $dir." }
          $shown = (Get-ItemProperty $key -ErrorAction Stop).DisplayVersion
          if ($shown -ne $version) { throw "DisplayVersion ist '$shown', erwartet '$version'." }
          Write-Host "Installiert nach $dir, DisplayVersion $shown"
          if ($haveLegacy) {
            if (Test-Path "$legacyDir\Traudi.exe") { throw 'Die 32-Bit-Altinstallation ist noch da.' }
            if (Test-Path $legacyKey) { throw 'Der Registry-Eintrag der Altinstallation ist noch da.' }
            Write-Host 'Altinstallation wurde entfernt.'
          }

          # 3. Selbsttest aus dem installierten Ordner.
          $s = Start-Process "$dir\Traudi.exe" -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput installed.out -RedirectStandardError installed.err
          Get-Content installed.out
          if ($s.ExitCode -ne 0 -and -not ($s.ExitCode -eq 3 -and -not $env:HF_TOKEN)) {
            Get-Content installed.err
            throw "Selbsttest der installierten Fassung fehlgeschlagen (Exit-Code $($s.ExitCode))."
          }

          # 4. Still deinstallieren. Der NSIS-Deinstaller kopiert sich nach
          #    %TEMP% und kehrt sofort zurueck -- deshalb auf das Ergebnis warten.
          Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 90 -and (Test-Path "$dir\Traudi.exe"); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path "$dir\Traudi.exe") { throw 'Deinstallation hat Traudi.exe nicht entfernt.' }
          if (Test-Path $key) { throw 'Deinstallation hat den Registry-Eintrag nicht entfernt.' }
          Write-Host 'Deinstallation sauber.'
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v4
        with:
          name: traudi-windows-installer-${{ github.event.inputs.variant || 'cpu' }}
          path: pyinstaller/win_installer/*.exe
          if-no-files-found: error

      # Zum Ausprobieren ohne Administratorrechte: derselbe Programmordner wie
      # im Installer, als ZIP. Entpacken, Traudi.exe starten -- Einstellungen
      # und Whisper-Modelle landen wie bei der installierten Fassung im
      # Benutzerprofil. Nur als Bau-Artefakt, nicht am Release.
      - uses: actions/upload-artifact@v4
        with:
          name: traudi-portable-${{ github.event.inputs.variant || 'cpu' }}
          path: pyinstaller/dist/Traudi_${{ github.event.inputs.variant || 'cpu' }}/Traudi/
          if-no-files-found: error
          retention-days: 14

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pyinstaller/win_installer/*.exe
