name: Tests

on:
  push:
  pull_request:

# Die Tests kommen ohne torch, ohne Modellgewichte und ohne GUI aus und laufen
# deshalb in unter einer Minute. Der Installer-Bau bleibt bewusst ein eigener
# Workflow -- der dauert Größenordnungen länger und soll nicht bei jedem Push
# anspringen.
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PyQt6 braucht auch ohne sichtbares Fenster ein paar Systembibliotheken.
      # Ohne sie wuerden die Editor-Tests stillschweigend uebersprungen -- und
      # gerade sie pruefen, ob eine umbenannte Sprecherangabe ihre Zeitmarke
      # behaelt.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest PyYAML python-i18n PyQt6

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q
